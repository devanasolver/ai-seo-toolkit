[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-seo-toolkit"
version = "0.1.0"
description = "Free toolkit to check how visible a website is to AI search (ChatGPT, Perplexity, Gemini, Claude), pull Google Search Console data, and research keywords. No paid API keys."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Anas Solver", email = "hello@airankwp.com"}]
keywords = ["seo", "geo", "ai-search", "llms-txt", "search-console", "keyword-research"]
dependencies = [
    "click>=8.0,<9.0",
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=4.9.0,<7.0.0",
]

[project.optional-dependencies]
gsc = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
]
dev = ["pytest>=7.0"]

[project.scripts]
aiseo = "aiseo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
